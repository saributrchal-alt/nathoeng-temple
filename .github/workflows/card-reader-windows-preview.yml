name: Build Saributr 1.5 Windows preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/card-reader-windows-preview.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c1e89b7bf2dee290f35a55b791666c21a31291e
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows executable
        run: dotnet publish card-reader/desktop/SaributrCardBridge/SaributrCardBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o card-reader/desktop/publish
      - uses: actions/upload-artifact@v4
        with:
          name: Saributr-Card-Reader-1.5-Windows
          path: card-reader/desktop/publish/Saributr-Card-Reader-1.5.exe
